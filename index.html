<!DOCTYPE html>
<html>
<head>
    <title>Factory Production Tycoon</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f0f2f5;
        }

        .card {
            background: white;
            width: 350px;
            margin: auto;
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px lightgray;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        .upgrade {
            background: green;
            color: white;
        }

        .produce {
            background: royalblue;
            color: white;
        }
    </style>
</head>

<body>

<div class="card">

<h1>🏭 Factory Production Tycoon</h1>

<h2>📦 Cartons: <span id="cartons">0</span></h2>

<h2>💰 Money: RM <span id="money">0</span></h2>

<h2>👷 Workers: <span id="workers">1</span></h2>

<h2>🧑‍💼 Salesmen: <span id="salesmen">1</span></h2>
    
<h2>📈 Output/sec: <span id="rate">1</span></h2>

<h2>🏭 Production Lines</h2>

<div id="factory"></div>

<br>

<button class="upgrade" onclick="buyMachine()">
    Buy New Machine (RM100)
</button>

<button class="produce" onclick="produce()">
    Produce Carton
</button>

<br><br>

<button class="upgrade" onclick="hireWorker()">
    Hire Worker (RM50)
</button>

<button class="upgrade" onclick="hireSalesman()">
    Hire Salesman (RM75)
</button>
    
<h3 id="status">Factory Running</h3>

</div>

<script>

let cartons = 0;
let money = 0;
let machines = [
    { level: 1 }
];
let workers = 1;
let salesmen = 1;

function updateScreen() {

    document.getElementById("cartons").innerText = cartons;
    document.getElementById("money").innerText = money;
    document.getElementById("machines").innerText = machines;
    document.getElementById("workers").innerText = workers;
    document.getElementById("salesmen").innerText = salesmen;
    document.getElementById("rate").innerText =
        machines * workers;
let html = "";

machines.forEach((machine,index)=>{

    html += `
    <div style="
        border:1px solid gray;
        margin:10px;
        padding:10px;
        border-radius:8px;
        background:white;
    ">

        🏭 Machine ${index+1}<br>

        Level: ${machine.level}<br><br>

        <button onclick="upgradeMachine(${index})">
            Upgrade
        </button>

        <button onclick="sellMachine(${index})">
            Sell
        </button>

    </div>
    `;
});

document.getElementById("factory").innerHTML = html;

}

function produce() {

    let output = 0;  machines.forEach(machine => {      output += machine.level * workers;  });

    cartons += output;
    money += output;

    updateScreen();

}

function upgradeMachine(index){

    let cost = machines[index].level * 50;

    if(money >= cost){

        money -= cost;
        machines[index].level++;

        updateScreen();

    }else{

        alert("Not enough money!");

    }

}

function sellMachine(index){

    if(machines.length <= 1){

        alert("Cannot sell last machine");

        return;

    }

    money += machines[index].level * 25;

    machines.splice(index,1);

    updateScreen();

}

function hireWorker() {

    if(money >= 50){

        money -= 50;
        workers++;

        updateScreen();

    } else {

        alert("Not enough money!");

    }
}

function hireSalesman() {

    if(money >= 75){

        money -= 75;
        salesmen++;

        updateScreen();

    } else {

        alert("Not enough money!");

    }

}

function autoProduce() {

    let output = 0;  machines.forEach(machine => {      output += machine.level * workers;  });

    cartons += output;

    updateScreen();

}

function autoSell() {

    let sold = Math.min(cartons, salesmen * 5);

    cartons -= sold;
    money += sold * 2;

    updateScreen();

}

setInterval(autoProduce, 1000);
setInterval(autoSell, 1000);

</script>

</body>
</html>
