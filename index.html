<!DOCTYPE html>
<html>
<head>
    <title>My First Game</title>
</head>
<body style="text-align:center;font-family:Arial">

    <h1>Click Game</h1>

    <h2>Score: <span id="score">0</span></h2>

    <button onclick="addPoint()">Click Me!</button>

    <script>
        let score = 0;

        function addPoint() {
            score++;
            document.getElementById("score").innerText = score;
        }
    </script>

</body>
</html>
