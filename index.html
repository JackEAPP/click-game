<!DOCTYPE html>
<html>
<head>
    <title>Factory Production Tycoon</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f0f2f5;
        }

        .card {
            background: white;
            width: 350px;
            margin: auto;
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px lightgray;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        .upgrade {
            background: green;
            color: white;
        }

        .produce {
            background: royalblue;
            color: white;
        }
    </style>
</head>

<body>

<div class="card">

<h1>🏭 Factory Production Tycoon</h1>

<h2>📦 Cartons: <span id="cartons">0</span></h2>

<h2>💰 Money: RM <span id="money">0</span></h2>

<h2>⚙️ Machines: <span id="machines">1</span></h2>

<h2>👷 Workers: <span id="workers">1</span></h2>

<h3>🎯 Daily Target: 1700</h3>

<button class="produce" onclick="produce()">
    Produce Carton
</button>

<br><br>

<button class="upgrade" onclick="buyMachine()">
    Buy Machine (RM100)
</button>

<button class="upgrade" onclick="hireWorker()">
    Hire Worker (RM50)
</button>

<h3 id="status">Factory Running</h3>

</div>

<script>

let cartons = 0;
let money = 0;
let machines = 1;
let workers = 1;

function updateScreen() {

    document.getElementById("cartons").innerText = cartons;
    document.getElementById("money").innerText = money;
    document.getElementById("machines").innerText = machines;
    document.getElementById("workers").innerText = workers;

    if(cartons >= 1700){
        document.getElementById("status").innerText =
        "✅ Daily Target Achieved!";
    }

}

function produce() {

    let output = machines * workers;

    cartons += output;
    money += output;

    updateScreen();

}

function buyMachine() {

    if(money >= 100){

        money -= 100;
        machines++;

        updateScreen();

    } else {

        alert("Not enough money!");

    }

}

function hireWorker() {

    if(money >= 50){

        money -= 50;
        workers++;

        updateScreen();

    } else {

        alert("Not enough money!");

    }

}

function autoProduce() {

    let output = machines * workers;

    cartons += output;
    money += output;

    updateScreen();

}

setInterval(autoProduce, 1000);

</script>

</body>
</html>
