<!DOCTYPE html>
<html>
<head>
    <title>Factory Sandbox Tycoon</title>

    <style>
        body{
            font-family:Arial;
            text-align:center;
            background:#f5f5f5;
            margin:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px lightgray;
            max-width:1000px;
            margin:auto;
        }

        button{
            padding:10px 15px;
            margin:5px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .machine{
            border:1px solid #ccc;
            background:white;
            border-radius:8px;
            padding:10px;
            margin:10px;
            width:200px;
            display:inline-block;
        }

        .green{
            background:green;
            color:white;
        }

        .blue{
            background:royalblue;
            color:white;
        }

        .orange{
            background:orange;
            color:white;
        }
    </style>
</head>

<body>

<div class="card">

<h1>🏭 Factory Sandbox Tycoon</h1>

<h2>
📦 Inventory:
<span id="cartons">0</span> /
<span id="capacity">100</span>
</h2>

<h2>
🏬 Warehouse Level:
<span id="warehouseLevel">1</span>
</h2>

<h2>
💰 Money:
RM <span id="money">100</span>
</h2>

<h2>
👷 Workers:
<span id="workers">1</span>
</h2>

<h2>
🧑‍💼 Salesmen:
<span id="salesmen">1</span>
</h2>

<h2>
📈 Production/sec:
<span id="prodRate">1</span>
</h2>

<h2>
🚚 Sales/sec:
<span id="salesRate">5</span>
</h2>

<h3 id="status">🏭 Factory Running</h3>

<button class="green" onclick="hireWorker()">
Hire Worker (RM50)
</button>

<button class="green" onclick="hireSalesman()">
Hire Salesman (RM75)
</button>

<button class="blue" onclick="buyMachine()">
Buy Machine (RM100)
</button>

<button class="orange" onclick="upgradeWarehouse()">
Upgrade Warehouse
</button>

<h2>🏭 Machines</h2>

<div id="factory"></div>

</div>

<script>

let cartons = 0;
let money = 100;

let workers = 1;
let salesmen = 1;

let warehouseLevel = 1;
let warehouseCapacity = 100;

let machines = [
    {
        level:1
    }
];

function getProductionRate(){

    let total = 0;

    machines.forEach(machine=>{

        total += machine.level * workers;

    });

    return total;

}

function updateScreen(){

    document.getElementById("cartons").innerText =
        Math.floor(cartons);

    document.getElementById("capacity").innerText =
        warehouseCapacity;

    document.getElementById("warehouseLevel").innerText =
        warehouseLevel;

    document.getElementById("money").innerText =
        Math.floor(money);

    document.getElementById("workers").innerText =
        workers;

    document.getElementById("salesmen").innerText =
        salesmen;

    document.getElementById("prodRate").innerText =
        getProductionRate();

    document.getElementById("salesRate").innerText =
        salesmen * 5;

    if(cartons >= warehouseCapacity){

        document.getElementById("status").innerText =
        "🚨 Warehouse Full";

    }else{

        document.getElementById("status").innerText =
        "🏭 Factory Running";

    }

    let machineHTML = "";

    machines.forEach((machine,index)=>{

        let upgradeCost = machine.level * 50;
        let sellValue = machine.level * 25;

        machineHTML += `

        <div class="machine">

            <h3>🏭 Machine ${index+1}</h3>

            <p>Level ${machine.level}</p>

            <p>
                Output:
                ${machine.level * workers}/sec
            </p>

            <button onclick="upgradeMachine(${index})">

                ⬆ Upgrade

                <br>

                RM${upgradeCost}

            </button>

            <button onclick="sellMachine(${index})">

                💰 Sell

                <br>

                RM${sellValue}

            </button>

        </div>

        `;

    });

    document.getElementById("factory").innerHTML =
        machineHTML;

}

function buyMachine(){

    if(money >= 100){

        money -= 100;

        machines.push({
            level:1
        });

        updateScreen();

    }else{

        alert("Not enough money");

    }

}

function upgradeMachine(index){

    let cost = machines[index].level * 50;

    if(money >= cost){

        money -= cost;

        machines[index].level++;

        updateScreen();

    }else{

        alert("Not enough money");

    }

}

function sellMachine(index){

    if(machines.length <= 1){

        alert("Cannot sell last machine");

        return;

    }

    let value = machines[index].level * 25;

    money += value;

    machines.splice(index,1);

    updateScreen();

}

function hireWorker(){

    if(money >= 50){

        money -= 50;

        workers++;

        updateScreen();

    }else{

        alert("Not enough money");

    }

}

function hireSalesman(){

    if(money >= 75){

        money -= 75;

        salesmen++;

        updateScreen();

    }else{

        alert("Not enough money");

    }

}

function upgradeWarehouse(){

    let cost = warehouseLevel * 200;

    if(money >= cost){

        money -= cost;

        warehouseLevel++;

        warehouseCapacity += 100;

        updateScreen();

    }else{

        alert("Not enough money");

    }

}

function autoProduce(){

    let production = getProductionRate();

    let availableSpace =
        warehouseCapacity - cartons;

    let actualProduction =
        Math.min(production, availableSpace);

    cartons += actualProduction;

    updateScreen();

}

function autoSell(){

    let sold = Math.min(
        cartons,
        salesmen * 5
    );

    cartons -= sold;

    money += sold * 2;

    updateScreen();

}

setInterval(autoProduce,1000);

setInterval(autoSell,1000);

updateScreen();

</script>

</body>
</html>
